<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calendario - CRM Aventura Total</title>
    
    <!-- PWA CONFIGURACIÓN -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AVT CRM">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    <meta name="application-name" content="Aventura Total CRM">
    
    <!-- Fuentes: Inter vía Fontsource -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.15/index.css">
    
    <!-- Iconos: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --sidebar-bg: #ffffff;
            --sidebar-text: #475569;
            --sidebar-active-bg: #e0e7ff;
            --sidebar-active-text: #4338ca;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active-bg: #334155;
            --sidebar-active-text: #818cf8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== LAYOUT ===== */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px; 
            background: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color);
            position: fixed; height: 100vh; z-index: 1001;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        
        .sidebar-header { 
            padding: 20px 24px; 
            display: flex; align-items: center; gap: 12px; 
            border-bottom: 1px solid var(--border-color); 
            flex-shrink: 0;
        }
        .brand-icon { 
            width: 36px; height: 36px; 
            background: linear-gradient(135deg, var(--primary), #8b5cf6); 
            border-radius: var(--radius-sm); 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 20px; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }
        .brand-text { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; color: var(--text-main); }
        .brand-text span { color: var(--primary); }

        .nav-menu { list-style: none; padding: 16px 12px; flex: 1; overflow-y: auto; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--sidebar-text); text-decoration: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500; transition: all 0.2s ease;
        }
        .nav-link i { font-size: 20px; flex-shrink: 0; }
        .nav-link:hover { background: var(--bg-body); color: var(--primary); }
        .nav-link.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .user-profile { 
            display: flex; align-items: center; gap: 12px; padding: 12px; 
            border-radius: var(--radius-sm); background: var(--bg-body); 
            cursor: pointer; transition: background 0.2s;
        }
        .user-profile:hover { background: var(--border-color); }
        .avatar { 
            width: 36px; height: 36px; background: var(--primary); color: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: 600; font-size: 14px; flex-shrink: 0;
        }
        .user-details { overflow: hidden; }
        .user-details h4 { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details p { font-size: 11px; color: var(--text-muted); }

        .main-content { margin-left: 260px; flex: 1; padding: 32px; transition: margin-left 0.3s; width: 100%; }
        
        /* Mobile Menu */
        .menu-toggle { 
            display: none; position: fixed; top: 16px; left: 16px; z-index: 1002; 
            background: var(--bg-surface); border: 1px solid var(--border-color); 
            width: 44px; height: 44px; border-radius: var(--radius-sm); cursor: pointer; 
            color: var(--text-main); box-shadow: var(--shadow-md); 
            align-items: center; justify-content: center;
        }
        .overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); 
            z-index: 1000; opacity: 0; pointer-events: none; 
            transition: opacity 0.3s; backdrop-filter: blur(4px); 
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* ===== HEADER ===== */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
        .page-title h1 { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .page-title p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        
        .actions-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn { 
            padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; 
            cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; 
            transition: all 0.2s ease; white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-body); border-color: var(--text-muted); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-icon { 
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface); 
            border: 1px solid var(--border-color); color: var(--text-muted); 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; flex-shrink: 0;
        }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

        /* ===== EVENTOS GRID ===== */
        .eventos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .evento-card {
            background: var(--bg-surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .evento-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .evento-card:active { transform: scale(0.98); }

        .evento-header {
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            border-bottom: 1px solid var(--border-color);
        }
        .evento-titulo {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .evento-fechas {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .evento-pax {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .evento-destino {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .evento-acciones {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-body);
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .btn-evento {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-evento:active { transform: scale(0.96); }
        .btn-evento:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-ver-evento { background: var(--primary); color: white; }
        .btn-whatsapp-evento { background: #25D366; color: white; }
        .btn-eliminar-evento { background: var(--danger); color: white; }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-contenido {
            background: var(--bg-surface);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }
        .modal-header h3 {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cerrar-modal {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .cerrar-modal:hover { color: var(--danger); background: var(--danger-light); }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .dark-mode .form-group input:focus,
        .dark-mode .form-group select:focus,
        .dark-mode .form-group textarea:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 180px; }

        /* ===== DÍAS Y NOTAS ===== */
        .dias-container { margin-top: 20px; }
        .dia-card {
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }
        .dia-titulo {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nota-item {
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-left: 3px solid var(--primary);
            border: 1px solid var(--border-color);
        }
        .nota-texto {
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .nota-fecha {
            font-size: 11px;
            color: var(--text-muted);
        }
        .btn-agregar-nota {
            width: 100%;
            padding: 8px;
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-agregar-nota:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .dark-mode .btn-agregar-nota:hover { background: rgba(99, 102, 241, 0.15); }

        .nota-actions { display: flex; gap: 6px; margin-top: 6px; }
        .btn-nota {
            border: none;
            border-radius: 5px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-nota:active { transform: scale(0.95); }
        .btn-nota-editar { background: var(--primary); color: white; }
        .btn-nota-editar:hover { background: var(--primary-hover); }
        .btn-nota-eliminar { background: var(--danger); color: white; }
        .btn-nota-eliminar:hover { background: #dc2626; }

        /* ===== PRELOADER ===== */
        .preloader-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        .preloader-popup.oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-popup-contenido {
            background: var(--bg-surface);
            border-radius: var(--radius);
            padding: 40px 48px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            animation: popupFadeIn 0.3s ease;
        }
        @keyframes popupFadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .preloader-popup-icono {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .preloader-popup-titulo {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }
        .preloader-popup-subtitulo {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) { .eventos-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; } 
            .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
            .main-content { margin-left: 0; padding: 20px; padding-top: 76px; } 
            .menu-toggle { display: flex; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .eventos-grid { grid-template-columns: 1fr; gap: 16px; }
            .evento-acciones { flex-direction: column; }
            .btn-evento { width: 100%; }
            .modal-contenido { padding: 20px; }
            .preloader-popup-contenido { padding: 30px 24px; }
            .form-row { flex-direction: column; }
            .form-row .form-group { min-width: unset; }
        }
        @media (max-width: 480px) {
            .page-title h1 { font-size: 20px; }
            .modal-contenido { padding: 16px; }
            .preloader-popup-contenido { padding: 24px 18px; }
            .preloader-popup-icono { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <!-- Mobile Toggle -->
    <button class="menu-toggle" id="menuBtn" aria-label="Abrir menú"><i class="ph ph-list" style="font-size: 24px;"></i></button>
    <div class="overlay" id="menuOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon"><i class="ph-bold ph-mountains"></i></div>
                <div class="brand-text">Aventura<span>Total</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                <li class="nav-item"><a href="clientes.html" class="nav-link"><i class="ph ph-users"></i> Clientes</a></li>
                <li class="nav-item"><a href="reservas.html" class="nav-link"><i class="ph ph-calendar-check"></i> Reservas</a></li>
                <li class="nav-item"><a href="seguimiento.html" class="nav-link"><i class="ph ph-chart-line-up"></i> Seguimiento</a></li>
                <li class="nav-item"><a href="emails.html" class="nav-link"><i class="ph ph-whatsapp-logo"></i> WhatsApp</a></li>

            <div class="sidebar-footer">

                    <i class="ph ph-sign-out" style="margin-left: auto; color: var(--text-muted); font-size: 18px;"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="page-title"><h1>📅 Calendario de Eventos</h1><p>Gestión de itinerarios y actividades</p></div>
                <div class="actions-group">
                    <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema"><i class="ph ph-moon" id="themeIcon"></i></button>
                    <button class="btn btn-success" onclick="cargarEventos()"><i class="ph ph-arrows-clockwise"></i> Recargar</button>
                </div>
            </header>

            <button class="btn btn-success" onclick="mostrarModalCrearEvento()"><i class="ph ph-plus"></i> Crear nuevo evento</button>

            <div id="eventosContainer" class="eventos-grid">
                <div style="text-align:center; grid-column:1/-1; padding:50px; color: var(--text-muted);">⏳ Cargando eventos...</div>
            </div>
        </main>
    </div>

    <!-- PRELOADER POPUP -->
    <div id="preloaderPopup" class="preloader-popup oculto">
        <div class="preloader-popup-contenido">
            <div class="preloader-popup-icono"></div>
            <div class="preloader-popup-titulo">Sincronizando<span class="puntos"></span></div>
            <div class="preloader-popup-subtitulo">Cargando datos del servidor...</div>
        </div>
    </div>

        const preloaderPopup = document.getElementById('preloaderPopup');
        function mostrarPreloader() { if (preloaderPopup) preloaderPopup.classList.remove('oculto'); }
        function ocultarPreloader() { if (preloaderPopup) preloaderPopup.classList.add('oculto'); }
        
        function convertirFechaISOtoDDMMYYYY(fechaIso) {
            if (!fechaIso) return '';
            const fecha = new Date(fechaIso);
            if (isNaN(fecha.getTime())) return fechaIso;
            const dia = fecha.getDate().toString().padStart(2, '0');
            const mes = (fecha.getMonth() + 1).toString().padStart(2, '0');
            const anio = fecha.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        function formatearRangoFechas(fechaInicio, fechaFin) {
            const inicio = convertirFechaISOtoDDMMYYYY(fechaInicio);
            const fin = convertirFechaISOtoDDMMYYYY(fechaFin);
            return `Del ${inicio} al ${fin}`;
        }
        
        // ==================================================
        // CARGAR EVENTOS
        // ==================================================
        async function cargarEventos() {
            mostrarPreloader();
            try {
                const url = `${APP_SCRIPT_URL}?action=obtenerEventos&t=${Date.now()}`;
                console.log('📡 Cargando eventos...');
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📦 Eventos recibidos:', data);
                
                if (data.success && data.eventos) {
                    eventos = data.eventos;
                    renderizarEventos();
                } else {
                    document.getElementById('eventosContainer').innerHTML = `<div style="text-align:center; padding:50px; color: var(--danger);">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('eventosContainer').innerHTML = '<div style="text-align:center; padding:50px; color: var(--danger);">❌ Error al conectar con el servidor</div>';
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // RENDERIZAR EVENTOS
        // ==================================================
        function renderizarEventos() {
            const container = document.getElementById('eventosContainer');
            if (!container) return;
            
            if (eventos.length === 0) {
                container.innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:50px; color: var(--text-muted);">📭 No hay eventos creados. Haz clic en "Crear nuevo evento"</div>';
                return;
            }
            
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            container.innerHTML = eventos.map(evento => {
                let destinoHtml = '';
                if (evento.pais && evento.ciudad) {
                    destinoHtml = `<div class="evento-destino"><i class="ph ph-map-pin"></i> ${escapeHtml(evento.pais)} - ${escapeHtml(evento.ciudad)}</div>`;
                }
                return `
                <div class="evento-card">
                    <div class="evento-header">
                        <div class="evento-titulo">${escapeHtml(evento.nombre)}</div>
                        <div class="evento-fechas"><i class="ph ph-calendar"></i> ${formatearRangoFechas(evento.fechaInicio, evento.fechaFin)}</div>
                        <div class="evento-pax"><i class="ph ph-users"></i> ${evento.pax || '0'} pasajeros</div>
                        ${destinoHtml}
                    </div>
                    <div class="evento-acciones">
                        <button class="btn-evento btn-ver-evento" onclick="verEvento('${evento.id}')"><i class="ph ph-eye"></i> Ver días</button>
                        <button class="btn-evento btn-whatsapp-evento" onclick="compartirEvento('${evento.id}')"><i class="ph ph-whatsapp-logo"></i> WhatsApp</button>
                        <button class="btn-evento btn-eliminar-evento" onclick="eliminarEvento('${evento.id}')"><i class="ph ph-trash"></i> Eliminar</button>
                    </div>
                </div>
            `}).join('');
        }
        
        // ==================================================
        // FUNCIÓN PARA GENERAR NOMBRE DEL EVENTO AUTOMÁTICAMENTE
        // ==================================================
        function generarNombreEvento() {
            const ciudadSelect = document.getElementById('eventoCiudad');
            const paxInput = document.getElementById('eventoPax');
            
            const ciudad = ciudadSelect ? ciudadSelect.value : '';
            const pax = paxInput ? paxInput.value : '0';
            
            if (ciudad && pax && parseInt(pax) > 0) {
                // Limpiar el nombre de la ciudad (eliminar emoji)
                const ciudadLimpia = getCiudadSinEmoji(ciudad);
                const nombreInput = document.getElementById('eventoNombre');
                if (nombreInput) {
                    nombreInput.value = `${ciudadLimpia} ${pax} Pax`;
                }
            } else if (ciudad && (!pax || parseInt(pax) === 0)) {
                // Si solo hay ciudad, poner solo la ciudad
                const ciudadLimpia = getCiudadSinEmoji(ciudad);
                const nombreInput = document.getElementById('eventoNombre');
                if (nombreInput) {
                    nombreInput.value = ciudadLimpia;
                }
            }
        }

        // Función para actualizar ciudades según el país seleccionado
        window.actualizarCiudadesEvento = function() {
            const paisSelect = document.getElementById('eventoPais');
            const ciudadSelect = document.getElementById('eventoCiudad');
            const pais = paisSelect.value;
            
            ciudadSelect.innerHTML = '<option value="">Selecciona una ciudad</option>';
            
            if (pais) {
                const ciudades = getCiudades(pais);
                if (ciudades.length > 0) {
                    ciudadSelect.disabled = false;
                    ciudades.forEach(ciudad => {
                        const option = document.createElement('option');
                        option.value = ciudad;
                        option.textContent = ciudad;
                        ciudadSelect.appendChild(option);
                    });
                } else {
                    ciudadSelect.disabled = true;
                    ciudadSelect.innerHTML = '<option value="">No hay ciudades disponibles</option>';
                }
            } else {
                ciudadSelect.disabled = true;
                ciudadSelect.innerHTML = '<option value="">Selecciona un país primero</option>';
            }
            
            // Limpiar el nombre del evento cuando cambia el país
            const nombreInput = document.getElementById('eventoNombre');
            if (nombreInput) {
                nombreInput.value = '';
            }
        };

        async function crearEvento() {
            const nombre = document.getElementById('eventoNombre')?.value;
            const pais = document.getElementById('eventoPais')?.value;
            const ciudad = document.getElementById('eventoCiudad')?.value;
            const fechaInicioInput = document.getElementById('eventoFechaInicio')?.value;
            const fechaFinInput = document.getElementById('eventoFechaFin')?.value;
            const pax = document.getElementById('eventoPax')?.value || '0';
            
            if (!nombre || !fechaInicioInput || !fechaFinInput) {
                alert('⚠️ Por favor, complete todos los campos obligatorios');
                return;
            }
            
            // Validar que si seleccionó país, también seleccione ciudad
            if (pais && !ciudad) {
                alert('⚠️ Por favor, seleccione una ciudad para el país elegido');
                return;
            }
            
            mostrarPreloader();
            
            try {
                const eventoId = 'EV-' + Date.now();
                const formData = new URLSearchParams();
                formData.append('action', 'guardarEvento');
                formData.append('id', eventoId);
                formData.append('nombre', nombre);
                formData.append('pais', pais || '');
                formData.append('ciudad', ciudad || '');
                formData.append('fechaInicio', fechaInicioInput);
                formData.append('fechaFin', fechaFinInput);
                formData.append('pax', pax);
                formData.append('estado', 'activo');
                
                const response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Evento creado correctamente');
                    cerrarModal('modalCrearEvento');
                    await cargarEventos();
                } else {
                    alert('❌ Error al crear evento: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al conectar con el servidor');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // VER EVENTO
        // ==================================================
        async function verEvento(eventoId) {
            mostrarPreloader();
            try {
                const url = `${APP_SCRIPT_URL}?action=obtenerEventoCompleto&eventoId=${eventoId}&t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.success || !data.evento) {
                    alert('Error al cargar el evento');
                    ocultarPreloader();
                    return;
                }
                
                const evento = data.evento;
                const notasEvento = data.notas || [];
                
                const fechaInicioDate = new Date(evento.fechaInicio);
                const fechaFinDate = new Date(evento.fechaFin);
                
                const fechas = [];
                for (let d = new Date(fechaInicioDate); d <= fechaFinDate; d.setDate(d.getDate() + 1)) {
                    const dia = d.getDate().toString().padStart(2, '0');
                    const mes = (d.getMonth() + 1).toString().padStart(2, '0');
                    const anio = d.getFullYear();
                    fechas.push(`${dia}/${mes}/${anio}`);
                }
                
                const notasPorFecha = {};
                notasEvento.forEach(nota => {
                    let fechaNota = nota.fecha;
                    if (fechaNota && fechaNota.includes('T')) {
                        fechaNota = convertirFechaISOtoDDMMYYYY(fechaNota);
                    }
                    if (!notasPorFecha[fechaNota]) notasPorFecha[fechaNota] = [];
                    notasPorFecha[fechaNota].push(nota);
                });
                
                let diasHtml = '';
                for (const fecha of fechas) {
                    const notasDelDia = notasPorFecha[fecha] || [];
                    let notasHtml = '';
                    if (notasDelDia.length === 0) {
                        notasHtml = '<div style="color:var(--text-muted); font-size:12px; padding:8px;">Sin notas</div>';
                    } else {
                        notasDelDia.forEach(nota => {
                            notasHtml += `
                                <div class="nota-item">
                                    <div class="nota-texto">${escapeHtml(nota.nota)}</div>
                                    <div class="nota-fecha"><i class="ph ph-clock"></i> ${nota.tipo === 'mañana' ? '🌅 Mañana' : '🌙 Tarde'}</div>
                                    <div class="nota-actions">
                                        <button class="btn-nota btn-nota-editar" onclick="editarNota('${nota.id}', '${evento.id}', '${fecha}', '${escapeHtml(nota.nota)}', '${nota.tipo}')"><i class="ph ph-pencil"></i> Editar</button>
                                        <button class="btn-nota btn-nota-eliminar" onclick="eliminarNota('${nota.id}', '${evento.id}')"><i class="ph ph-trash"></i> Eliminar</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    
                    diasHtml += `
                        <div class="dia-card">
                            <div class="dia-titulo"><i class="ph ph-calendar-blank"></i> ${fecha}</div>
                            ${notasHtml}
                            <button class="btn-agregar-nota" onclick="mostrarModalAgregarNota('${evento.id}', '${fecha}')"><i class="ph ph-plus"></i> Agregar nota</button>
                        </div>
                    `;
                }
                
                let destinoInfo = '';
                if (evento.pais && evento.ciudad) {
                    destinoInfo = `<p><strong><i class="ph ph-map-pin"></i> Destino:</strong> ${escapeHtml(evento.pais)} - ${escapeHtml(evento.ciudad)}</p>`;
                }
                
                const modalHtml = `
                    <div id="modalEvento" class="modal" onclick="if(event.target===this) cerrarModal('modalEvento')">
                        <div class="modal-contenido">
                            <div class="modal-header">
                                <h3><i class="ph ph-calendar"></i> ${escapeHtml(evento.nombre)}</h3>
                                <button class="cerrar-modal" onclick="cerrarModal('modalEvento')"><i class="ph ph-x"></i></button>
                            </div>
                            <div style="margin-bottom:16px;">
                                <p><strong><i class="ph ph-calendar"></i> Período:</strong> ${formatearRangoFechas(evento.fechaInicio, evento.fechaFin)}</p>
                                <p><strong><i class="ph ph-users"></i> Pasajeros:</strong> ${evento.pax}</p>
                                ${destinoInfo}
                            </div>
                            <div class="dias-container">${diasHtml}</div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar el evento');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // AGREGAR NOTA
        // ==================================================
        function mostrarModalAgregarNota(eventoId, fecha) {
            const modalHtml = `
                <div id="modalAgregarNota" class="modal" onclick="if(event.target===this) cerrarModal('modalAgregarNota')">
                    <div class="modal-contenido">
                        <div class="modal-header">
                            <h3><i class="ph ph-note-pencil"></i> Agregar nota para ${fecha}</h3>
                            <button class="cerrar-modal" onclick="cerrarModal('modalAgregarNota')"><i class="ph ph-x"></i></button>
                        </div>
                        <div class="form-group">
                            <label>Nota</label>
                            <textarea id="notaTexto" rows="3" placeholder="Escriba su nota aquí..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Momento del día</label>
                            <select id="notaTipo">
                                <option value="mañana">🌅 Mañana</option>
                                <option value="tarde">🌙 Tarde</option>
                            </select>
                        </div>
                        <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="guardarNota('${eventoId}', '${fecha}')"><i class="ph ph-check"></i> Guardar nota</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
        
        async function guardarNota(eventoId, fecha) {
            const texto = document.getElementById('notaTexto')?.value;
            const tipo = document.getElementById('notaTipo')?.value;
            if (!texto) {
                alert('⚠️ Por favor, escriba una nota');
                return;
            }
            mostrarPreloader();
            try {
                const notaId = 'NOTA-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                const formData = new URLSearchParams();
                formData.append('action', 'guardarNota');
                formData.append('id', notaId);
                formData.append('eventoId', eventoId);
                formData.append('fecha', fecha);
                formData.append('nota', texto);
                formData.append('tipo', tipo);
                
                const response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Nota guardada correctamente');
                    cerrarModal('modalAgregarNota');
                    cerrarModal('modalEvento');
                    await verEvento(eventoId);
                } else {
                    alert('❌ Error al guardar nota: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al conectar con el servidor');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // EDITAR NOTA
        // ==================================================
        function editarNota(notaId, eventoId, fecha, textoActual, tipoActual) {
            const modalHtml = `
                <div id="modalEditarNota" class="modal" onclick="if(event.target===this) cerrarModal('modalEditarNota')">
                    <div class="modal-contenido">
                        <div class="modal-header">
                            <h3><i class="ph ph-pencil"></i> Editar nota para ${fecha}</h3>
                            <button class="cerrar-modal" onclick="cerrarModal('modalEditarNota')"><i class="ph ph-x"></i></button>
                        </div>
                        <div class="form-group">
                            <label>Nota</label>
                            <textarea id="notaTextoEditar" rows="3">${escapeHtml(textoActual)}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Momento del día</label>
                            <select id="notaTipoEditar">
                                <option value="mañana" ${tipoActual === 'mañana' ? 'selected' : ''}>🌅 Mañana</option>
                                <option value="tarde" ${tipoActual === 'tarde' ? 'selected' : ''}>🌙 Tarde</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="actualizarNota('${notaId}', '${eventoId}')"><i class="ph ph-check"></i> Actualizar nota</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
        
        async function actualizarNota(notaId, eventoId) {
            const texto = document.getElementById('notaTextoEditar')?.value;
            const tipo = document.getElementById('notaTipoEditar')?.value;
            if (!texto) {
                alert('⚠️ Por favor, escriba una nota');
                return;
            }
            mostrarPreloader();
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'actualizarNota');
                formData.append('id', notaId);
                formData.append('nota', texto);
                formData.append('tipo', tipo);
                
                const response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Nota actualizada correctamente');
                    cerrarModal('modalEditarNota');
                    cerrarModal('modalEvento');
                    await verEvento(eventoId);
                } else {
                    alert('❌ Error al actualizar nota: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al conectar con el servidor');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // ELIMINAR NOTA
        // ==================================================
        async function eliminarNota(notaId, eventoId) {
            if (!confirm('⚠️ ¿Estás seguro de eliminar esta nota?')) return;
            mostrarPreloader();
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'eliminarNota');
                formData.append('id', notaId);
                const response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Nota eliminada correctamente');
                    cerrarModal('modalEvento');
                    await verEvento(eventoId);
                } else {
                    alert('❌ Error al eliminar nota: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al conectar con el servidor');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // ELIMINAR EVENTO
        // ==================================================
        async function eliminarEvento(eventoId) {
            if (!confirm('⚠️ ¿Estás seguro de eliminar este evento? Se eliminarán también todas las notas asociadas.')) return;
            mostrarPreloader();
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'eliminarEvento');
                formData.append('id', eventoId);
                const response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Evento eliminado correctamente');
                    await cargarEventos();
                } else {
                    alert('❌ Error al eliminar evento: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al conectar con el servidor');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // COMPARTIR EVENTO POR WHATSAPP
        // ==================================================
        async function compartirEvento(eventoId) {
            mostrarPreloader();
            try {
                const url = `${APP_SCRIPT_URL}?action=obtenerEventoCompleto&eventoId=${eventoId}&t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.success || !data.evento) {
                    alert('Error al cargar el evento');
                    ocultarPreloader();
                    return;
                }
                
                const evento = data.evento;
                const notasEvento = data.notas || [];
                
                const fechaInicioDate = new Date(evento.fechaInicio);
                const fechaFinDate = new Date(evento.fechaFin);
                
                const fechasConNotas = [];
                for (let d = new Date(fechaInicioDate); d <= fechaFinDate; d.setDate(d.getDate() + 1)) {
                    const dia = d.getDate().toString().padStart(2, '0');
                    const mes = (d.getMonth() + 1).toString().padStart(2, '0');
                    const anio = d.getFullYear();
                    const fechaStr = `${dia}/${mes}/${anio}`;
                    
                    const notasDelDia = notasEvento.filter(nota => {
                        let fechaNota = nota.fecha;
                        if (fechaNota && fechaNota.includes('T')) {
                            fechaNota = convertirFechaISOtoDDMMYYYY(fechaNota);
                        }
                        return fechaNota === fechaStr;
                    });
                    fechasConNotas.push({ fecha: fechaStr, notas: notasDelDia });
                }
                
                let mensaje = `🏔️ *AVENTURA TOTAL* 🏔️\n\n`;
                mensaje += `📅 *EVENTO: ${evento.nombre}*\n`;
                if (evento.pais && evento.ciudad) {
                    mensaje += `📍 *Destino:* ${evento.pais} - ${evento.ciudad}\n`;
                }
                mensaje += `👥 *Pasajeros:* ${evento.pax}\n\n`;
                mensaje += `📋 *ITINERARIO DIARIO:*\n`;
                mensaje += `........................................\n\n`;
                
                for (const item of fechasConNotas) {
                    mensaje += `📅 *${item.fecha}*\n`;
                    if (item.notas.length === 0) {
                        mensaje += `   Sin actividades programadas\n`;
                    } else {
                        item.notas.forEach(nota => {
                            const icono = nota.tipo === 'mañana' ? '🌅' : '🌙';
                            mensaje += `   ${icono} ${nota.nota}\n`;
                        });
                    }
                    mensaje += `\n........................................\n\n`;
                }
                
                mensaje += `🔗 *Reserve sus excursiones aquí*\n`;
                mensaje += `https://sebagsc2020.github.io/reservacordinador1/index.html\n\n`;
                mensaje += `🏔️ ¡Gracias por confiar en Aventura Total!`;
                
                const mensajeCodificado = encodeURIComponent(mensaje);
                window.open(`https://wa.me/?text=${mensajeCodificado}`, '_blank');
            } catch (error) {
                console.error('Error:', error);
                alert('Error al generar el mensaje');
            } finally {
                ocultarPreloader();
            }
        }
        
        // ==================================================
        // UTILIDADES
        // ==================================================
        function cerrarModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.remove();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ==================================================
        // INICIALIZAR
        // ==================================================
        function init() {
            cargarEventos();
        }
        
        window.verEvento = verEvento;
        window.cerrarModal = cerrarModal;
        window.mostrarModalCrearEvento = mostrarModalCrearEvento;
        window.crearEvento = crearEvento;
        window.mostrarModalAgregarNota = mostrarModalAgregarNota;
        window.guardarNota = guardarNota;
        window.editarNota = editarNota;
        window.actualizarNota = actualizarNota;
        window.eliminarNota = eliminarNota;
        window.compartirEvento = compartirEvento;
        window.eliminarEvento = eliminarEvento;
        window.logout = logout;
        window.toggleTheme = toggleTheme;
        window.cargarEventos = cargarEventos;
        window.actualizarCiudadesEvento = actualizarCiudadesEvento;
        window.generarNombreEvento = generarNombreEvento;
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
