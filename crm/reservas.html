<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reservas - CRM Aventura Total</title>
    
    <!-- PWA CONFIGURACIÓN -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AVT CRM">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    <meta name="application-name" content="Aventura Total CRM">
    
    <!-- Fuentes: Inter vía Fontsource -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.15/index.css">
    
    <!-- Iconos: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --sidebar-bg: #ffffff;
            --sidebar-text: #475569;
            --sidebar-active-bg: #e0e7ff;
            --sidebar-active-text: #4338ca;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active-bg: #334155;
            --sidebar-active-text: #818cf8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== LAYOUT ===== */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px; 
            background: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color);
            position: fixed; height: 100vh; z-index: 1001;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        
        .sidebar-header { 
            padding: 20px 24px; 
            display: flex; align-items: center; gap: 12px; 
            border-bottom: 1px solid var(--border-color); 
            flex-shrink: 0;
        }
        .brand-icon { 
            width: 36px; height: 36px; 
            background: linear-gradient(135deg, var(--primary), #8b5cf6); 
            border-radius: var(--radius-sm); 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 20px; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }
        .brand-text { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; color: var(--text-main); }
        .brand-text span { color: var(--primary); }

        .nav-menu { list-style: none; padding: 16px 12px; flex: 1; overflow-y: auto; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--sidebar-text); text-decoration: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500; transition: all 0.2s ease;
        }
        .nav-link i { font-size: 20px; flex-shrink: 0; }
        .nav-link:hover { background: var(--bg-body); color: var(--primary); }
        .nav-link.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .user-profile { 
            display: flex; align-items: center; gap: 12px; padding: 12px; 
            border-radius: var(--radius-sm); background: var(--bg-body); 
            cursor: pointer; transition: background 0.2s;
        }
        .user-profile:hover { background: var(--border-color); }
        .avatar { 
            width: 36px; height: 36px; background: var(--primary); color: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: 600; font-size: 14px; flex-shrink: 0;
        }
        .user-details { overflow: hidden; }
        .user-details h4 { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details p { font-size: 11px; color: var(--text-muted); }

        .main-content { margin-left: 260px; flex: 1; padding: 32px; transition: margin-left 0.3s; width: 100%; }
        
        /* Mobile Menu */
        .menu-toggle { 
            display: none; position: fixed; top: 16px; left: 16px; z-index: 1002; 
            background: var(--bg-surface); border: 1px solid var(--border-color); 
            width: 44px; height: 44px; border-radius: var(--radius-sm); cursor: pointer; 
            color: var(--text-main); box-shadow: var(--shadow-md); 
            align-items: center; justify-content: center;
        }
        .overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); 
            z-index: 1000; opacity: 0; pointer-events: none; 
            transition: opacity 0.3s; backdrop-filter: blur(4px); 
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* ===== HEADER ===== */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
        .page-title h1 { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .page-title p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        
        .actions-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn { 
            padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; 
            cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; 
            transition: all 0.2s ease; white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-body); border-color: var(--text-muted); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-icon { 
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface); 
            border: 1px solid var(--border-color); color: var(--text-muted); 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; flex-shrink: 0;
        }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

        .btn-reserva-manual {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }
        .btn-reserva-manual:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-reserva-manual:active { transform: scale(0.97); }

        /* ===== FILTERS BAR ===== */
        .filters-bar { 
            background: var(--bg-surface); 
            padding: 16px 20px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border-color);
            margin-bottom: 24px; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        .filter-input { 
            padding: 10px 16px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-sm); 
            font-size: 13px; 
            flex: 1; 
            min-width: 150px; 
            background: var(--bg-body);
            color: var(--text-main);
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .filter-select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-width: 160px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .dark-mode .filter-input:focus,
        .dark-mode .filter-select:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .total-reservas { 
            font-size: 13px; 
            color: var(--text-muted); 
            margin-bottom: 20px; 
            font-weight: 500;
        }

        /* ===== CARDS GRID ===== */
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .reserva-card {
            background: var(--bg-surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .reserva-card:active { transform: scale(0.98); }
        .reserva-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        .card-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-body);
        }
        .card-id {
            font-weight: 700;
            font-size: 12px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .dark-mode .card-id { background: rgba(99, 102, 241, 0.15); }
        
        .btn-editar-nombre {
            background: var(--primary-light);
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 11px;
            color: var(--primary);
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-editar-nombre:hover { background: var(--primary); color: white; }
        .btn-editar-nombre:active { transform: scale(0.95); }
        
        .card-estado-header {
            font-weight: 700;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .estado-pendiente { background: var(--warning-light); color: #b45309; }
        .estado-confirmado { background: var(--success-light); color: #047857; }
        .estado-pagado { background: var(--info-light); color: #1d4ed8; }
        .dark-mode .estado-pendiente { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .dark-mode .estado-confirmado { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .dark-mode .estado-pagado { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        
        .card-fecha {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body { padding: 16px; }
        .card-info { margin-bottom: 10px; }
        .card-info:last-child { margin-bottom: 0; }
        .card-label { 
            font-size: 10px; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 0.5px; 
            margin-bottom: 3px; 
            font-weight: 600;
        }
        .card-value { 
            font-size: 13px; 
            font-weight: 500; 
            color: var(--text-main); 
            word-break: break-word; 
        }

        .excursiones-lista-card { 
            margin: 0; 
            padding-left: 16px; 
            list-style: none; 
        }
        .excursiones-lista-card li { 
            font-size: 12px; 
            padding: 3px 0; 
            color: var(--text-muted); 
            border-bottom: 1px dashed var(--border-color); 
            position: relative;
        }
        .excursiones-lista-card li:last-child { border-bottom: none; }
        .excursiones-lista-card li::before {
            content: '▸';
            color: var(--primary);
            position: absolute;
            left: -14px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-body);
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .btn-card {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .btn-card:active { transform: scale(0.96); }
        .btn-card:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-confirmar-card { background: var(--success); color: white; }
        .btn-pendiente-card { background: var(--warning); color: #78350f; }
        .btn-pagar-card { background: var(--info); color: white; }
        .btn-whatsapp-card { background: #25D366; color: white; }
        .btn-excluir-card { background: var(--danger); color: white; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; } 
            .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
            .main-content { margin-left: 0; padding: 20px; padding-top: 76px; } 
            .menu-toggle { display: flex; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; } 
            .actions-group { width: 100%; justify-content: space-between; }
            .filters-bar { flex-direction: column; }
            .filter-input { width: 100%; }
            .filter-select { width: 100%; }
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .card-actions { flex-direction: column; }
            .btn-card { width: 100%; }
        }
        @media (max-width: 480px) {
            .page-title h1 { font-size: 20px; }
            .btn-reserva-manual { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Mobile Toggle -->
    <button class="menu-toggle" id="menuBtn" aria-label="Abrir menú"><i class="ph ph-list" style="font-size: 24px;"></i></button>
    <div class="overlay" id="menuOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon"><i class="ph-bold ph-mountains"></i></div>
                <div class="brand-text">Aventura<span>Total</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                <li class="nav-item"><a href="clientes.html" class="nav-link"><i class="ph ph-users"></i> Clientes</a></li>
                <li class="nav-item"><a href="reservas.html" class="nav-link active"><i class="ph ph-calendar-check"></i> Reservas</a></li>
                <li class="nav-item"><a href="seguimiento.html" class="nav-link"><i class="ph ph-chart-line-up"></i> Seguimiento</a></li>
                <li class="nav-item"><a href="emails.html" class="nav-link"><i class="ph ph-whatsapp-logo"></i> WhatsApp</a></li>
                <li class="nav-item"><a href="calendario.html" class="nav-link"><i class="ph ph-calendar"></i> Calendario</a></li>
                <li class="nav-item"><a href="clima.html" class="nav-link"><i class="ph ph-cloud-sun"></i> Clima</a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile" onclick="logout()">
                    <div class="avatar">AD</div>
                    <div class="user-details"><h4>Administrador</h4><p>Cerrar Sesión</p></div>
                    <i class="ph ph-sign-out" style="margin-left: auto; color: var(--text-muted); font-size: 18px;"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="page-title"><h1>📋 Reservas</h1><p>Gestión completa de todas las reservas</p></div>
                <div class="actions-group">
                    <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema"><i class="ph ph-moon" id="themeIcon"></i></button>
                    <button class="btn-reserva-manual" onclick="abrirReservaManual()"><i class="ph ph-plus"></i> Reserva manual</button>
                </div>
            </header>

            <div class="filters-bar">
                <input type="text" class="filter-input" placeholder="🔍 Buscar por nombre o excursión..." id="busquedaReserva">
                <input type="text" class="filter-input" placeholder="📍 Filtrar por ciudad..." id="filtroCiudad">
                <select class="filter-select" id="filtroEstado">
                    <option value="todos">📌 Todos los estados</option>
                    <option value="confirmado">✅ Confirmado</option>
                    <option value="pendiente">⏳ Pendiente</option>
                    <option value="pagado">💰 Pagado</option>
                </select>
                <select class="filter-select" id="filtroEvento">
                    <option value="todos">📅 Todos los eventos</option>
                </select>
                <button class="btn btn-primary" id="btnFiltrar"><i class="ph ph-funnel"></i> Filtrar</button>
                <button class="btn btn-success" id="btnRecargar"><i class="ph ph-arrows-clockwise"></i> Recargar</button>
                <button class="btn btn-secondary" id="btnPDFExterno"><i class="ph ph-file-pdf"></i> Generar PDF</button>
            </div>

            <div id="totalReservasSpan" class="total-reservas">0 reservas</div>

            <div id="cardsContainer" class="cards-grid">
                <div style="text-align:center; grid-column:1/-1; padding:50px; color: var(--text-muted);">⏳ Cargando...</div>
            </div>
        </main>
    </div>

    <script>
        // ==================================================
        // REGISTRAR SERVICE WORKER PARA PWA
        // ==================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registrado con éxito:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
        
        // Detectar si la app está instalada y se abre desde la pantalla de inicio
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            console.log('📱 App ejecutándose en modo standalone (sin barra de navegación)');
            document.body.classList.add('pwa-mode');
        }
        
        // ==================================================
        // FUNCIÓN PARA ABRIR RESERVA MANUAL
        // ==================================================
        function abrirReservaManual() {
            window.open('https://sebagsc2020.github.io/reservacordinador1/reservar.html', '_blank');
        }

        // ==================================================
        // MENÚ FLOTANTE
        // ==================================================
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('menuOverlay');
        const themeIcon = document.getElementById('themeIcon');
        
        function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : ''; }
        function closeMenu() { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
        menuBtn.addEventListener('click', toggleMenu); overlay.addEventListener('click', closeMenu);
        document.querySelectorAll('.nav-link').forEach(link => { link.addEventListener('click', () => { if (window.innerWidth <= 768) closeMenu(); }); });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode'); const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark); themeIcon.className = isDark ? 'ph ph-sun' : 'ph ph-moon';
        }
        if (localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode'); themeIcon.className = 'ph ph-sun';
        }

        if (sessionStorage.getItem('crm_logged') !== 'true') { 
            window.location.href = 'index.html'; 
        }

        function logout() { 
            sessionStorage.clear(); 
            window.location.href = 'index.html'; 
        }

        // ==================================================
        // CONFIGURACIÓN
        // ==================================================
        const SPREADSHEET_ID = '1-b2wCbejrgWe3TdPGe2Aslvtlw4_FURMXsTcSMhLAeI';
        const SHEET_NAME = 'Hoja 1';
        const JSON_URL = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME);
        const ESTADOS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOvtpKAbJIUTEJBy2oTODHNYkTJKqbjDLlaryP_QHgVXAXsR8potSmnpy59Etyj5cVvA/exec';
        const CALENDARIO_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvsRbRQn-Ty10gIH7u49aOVNg7tbd_BlRFpvYVau5vPfmXs6xPDeCX2hxz4l2f0mBHjA/exec';
        
        let reservasData = [];
        let reservasFiltradas = [];
        let estadosGlobales = {};
        let eventosCalendario = [];

        // ==================================================
        // CARGAR EVENTOS DEL CALENDARIO
        // ==================================================
        async function cargarEventosCalendario() {
            try {
                const url = `${CALENDARIO_SCRIPT_URL}?action=obtenerEventos&t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.eventos) {
                    eventosCalendario = data.eventos;
                    // Actualizar el selector de eventos
                    const selectEvento = document.getElementById('filtroEvento');
                    if (selectEvento) {
                        let options = '<option value="todos">📅 Todos los eventos</option>';
                        eventosCalendario.forEach(evento => {
                            const fechaInicio = convertirFechaISOtoDDMMYYYY(evento.fechaInicio);
                            const fechaFin = convertirFechaISOtoDDMMYYYY(evento.fechaFin);
                            options += `<option value="${evento.id}">📅 ${evento.nombre} (${fechaInicio} - ${fechaFin})</option>`;
                        });
                        selectEvento.innerHTML = options;
                    }
                    console.log('📅 Eventos cargados:', eventosCalendario.length);
                }
                return eventosCalendario;
            } catch (error) {
                console.error('Error al cargar eventos del calendario:', error);
                return [];
            }
        }

        // ==================================================
        // FUNCIONES DE FECHAS
        // ==================================================
        function convertirFechaISOtoDDMMYYYY(fechaIso) {
            if (!fechaIso) return '';
            const fecha = new Date(fechaIso);
            if (isNaN(fecha.getTime())) return fechaIso;
            const dia = fecha.getDate().toString().padStart(2, '0');
            const mes = (fecha.getMonth() + 1).toString().padStart(2, '0');
            const anio = fecha.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        function fechaDDMMYYYYtoNumero(fechaStr) {
            if (!fechaStr) return 0;
            const partes = fechaStr.split('/');
            if (partes.length !== 3) return 0;
            return parseInt(partes[2] + partes[1] + partes[0]);
        }

        // ==================================================
        // GUARDAR NOMBRE EDITADO EN LA NUBE
        // ==================================================
        async function guardarNombreEnNube(id, nuevoNombre) {

                const formData = new URLSearchParams();
                formData.append('action', 'actualizarNombre');
                formData.append('id', id);
                formData.append('nombre', nuevoNombre);
                
                const response = await fetch(ESTADOS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });
                
                const text = await response.text();
                console.log(`✅ Nombre guardado en nube: ${id} -> ${nuevoNombre}`, text);
                return true;
            } catch (error) {
                console.error('Error al guardar nombre en nube:', error);
                return false;
            }
        }

        // ==================================================
        // EDITAR NOMBRE DE LA RESERVA
        // ==================================================
        async function editarNombreReserva(id, nombreActual) {
            const nuevoNombre = prompt('✏️ Editar nombre del cliente:', nombreActual);
            if (!nuevoNombre || nuevoNombre.trim() === '') return;
            if (nuevoNombre === nombreActual) return;
            
            try {
                const reserva = reservasData.find(r => r.id === id);
                if (reserva) {
                    reserva.nombre = nuevoNombre.trim();
                    
                    const indexFiltrada = reservasFiltradas.findIndex(r => r.id === id);
                    if (indexFiltrada !== -1) reservasFiltradas[indexFiltrada].nombre = nuevoNombre.trim();
                    
                    const nombresEditados = JSON.parse(localStorage.getItem('nombresEditados') || '{}');
                    nombresEditados[id] = nuevoNombre.trim();
                    localStorage.setItem('nombresEditados', JSON.stringify(nombresEditados));
                    
                    await guardarNombreEnNube(id, nuevoNombre.trim());
                    
                    renderizarCards();
                    alert('✅ Nombre actualizado correctamente en la nube');
                }
            } catch (error) {
                console.error('Error al editar nombre:', error);
                alert('❌ Error al actualizar el nombre');
            }
        }

        function cargarNombresEditados() {
            return JSON.parse(localStorage.getItem('nombresEditados') || '{}');
        }

        // ==================================================
        // GUARDAR ESTADO EN LA NUBE
        // ==================================================
        async function guardarEstadoEnNube(id, nuevoEstado) {

                const formData = new URLSearchParams();

                formData.append('estado', nuevoEstado);

        // ==================================================
        // CARGAR ESTADOS DESDE LA NUBE
        // ==================================================
        async function cargarEstadosDesdeNube() {
            try {
                const localEstados = localStorage.getItem('estadosReservasCloud');
                if (localEstados) {
                    const parsed = JSON.parse(localEstados);
                    if (Object.keys(parsed).length > 0) {
                        estadosGlobales = parsed;
                        console.log('📥 Estados cargados desde localStorage:', Object.keys(estadosGlobales).length);
                    }
                }
                
                const response = await fetch(ESTADOS_SCRIPT_URL + '?action=obtener&t=' + Date.now());
                const data = await response.json();
                if (data.success && data.estados) {
                    estadosGlobales = data.estados;
                    localStorage.setItem('estadosReservasCloud', JSON.stringify(estadosGlobales));
                    console.log('📥 Estados sincronizados desde nube:', Object.keys(estadosGlobales).length);
                }
                return estadosGlobales;
            } catch (error) {
                console.error('Error al cargar desde nube:', error);
                const estadosLocal = JSON.parse(localStorage.getItem('estadosReservasCloud') || '{}');
                estadosGlobales = estadosLocal;
                return estadosLocal;
            }
        }

        // ==================================================
        // CARGAR RESERVAS
        // ==================================================
        async function cargarReservas() {
            const container = document.getElementById('cardsContainer');
            const totalSpan = document.getElementById('totalReservasSpan');
            if (!container) return;

            try {
                await cargarEventosCalendario();
                await cargarEstadosDesdeNube();

                const response = await fetch(JSON_URL + '&t=' + Date.now());
                const texto = await response.text();

                let jsonStr = texto;
                jsonStr = jsonStr.replace("/*O_o*/", "");
                jsonStr = jsonStr.replace("google.visualization.Query.setResponse(", "");
                jsonStr = jsonStr.slice(0, -2);

                const data = JSON.parse(jsonStr);
                const rows = data.table.rows;

                if (!rows || rows.length === 0) throw new Error('No hay datos');

                reservasData = [];
                const excluidos = JSON.parse(localStorage.getItem('reservasExcluidas') || '[]');
                const nombresEditados = cargarNombresEditados();

                for (let i = 0; i < rows.length; i++) {
                    const c = rows[i].c;
                    if (!c || c.length < 5) continue;

                    const id = (c[1] && c[1].v) ? String(c[1].v) : '';
                    if (!id || excluidos.includes(id)) continue;

                    const nombre = (c[2] && c[2].v) ? String(c[2].v) : '';
                    const apellido = (c[3] && c[3].v) ? String(c[3].v) : '';
                    const email = (c[4] && c[4].v) ? String(c[4].v) : '';
                    const telefono = (c[5] && c[5].v) ? String(c[5].v) : '';
                    const ciudad = (c[7] && c[7].v) ? String(c[7].v) : '';

                    let excursionesLista = [];
                    const excursionesRaw = (c[8] && c[8].v) ? String(c[8].v) : '';
                    if (excursionesRaw) {
                        if (excursionesRaw.includes('\n')) {
                            excursionesLista = excursionesRaw.split('\n');
                        } else if (excursionesRaw.includes(' | ')) {
                            excursionesLista = excursionesRaw.split(' | ');
                        } else {
                            excursionesLista = [excursionesRaw];
                        }
                        excursionesLista = excursionesLista.map(function(e) { 
                            return e.trim().replace(/^✔️\s*/, '').replace(/^\d+\.\s*/, '');
                        }).filter(function(e) { return e; });
                    }

                    let fecha = '';
                    const timestamp = (c[0] && c[0].v) ? c[0].v : null;
                    if (timestamp) {
                        const fechaObj = new Date(timestamp);
                        if (!isNaN(fechaObj.getTime())) {
                            fecha = fechaObj.getDate().toString().padStart(2,'0') + '/' + (fechaObj.getMonth()+1).toString().padStart(2,'0') + '/' + fechaObj.getFullYear();
                        }
                    }

                    const personas = (c[10] && c[10].v) ? String(c[10].v) : '1';
                    const formaPago = (c[11] && c[11].v) ? String(c[11].v) : 'No especificado';
                    const lugar = (c[12] && c[12].v) ? String(c[12].v) : 'No especificado';
                    let nombreCompleto = (nombre + ' ' + apellido).trim() || 'No especificado';
                    
                    if (nombresEditados[id]) {
                        nombreCompleto = nombresEditados[id];
                    }

                    let estado = estadosGlobales[id];
                    if (!estado || (estado !== 'pendiente' && estado !== 'confirmado' && estado !== 'pagado')) {
                        estado = 'confirmado';
                    }

                    reservasData.push({
                        id: id,
                        fecha: fecha,
                        nombre: nombreCompleto,
                        email: email,
                        telefono: telefono,
                        ciudad: ciudad,
                        excursionesLista: excursionesLista,
                        personas: parseInt(personas) || 1,
                        formaPago: formaPago,
                        lugar: lugar,
                        estado: estado
                    });
                }

                reservasData.sort(function(a, b) {
                    const numA = parseInt(a.id.replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.id.replace(/\D/g, '')) || 0;
                    return numB - numA;
                });

                reservasFiltradas = reservasData.slice();
                renderizarCards();
                if (totalSpan) totalSpan.textContent = reservasData.length + ' reservas';

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div style="text-align:center; color:var(--danger); grid-column:1/-1; padding:50px;">❌ Error: ' + error.message + '</div>';
            }
        }

        async function cambiarEstado(id, nuevoEstado) {
            const reserva = reservasData.find(function(r) { return r.id === id; });
            if (reserva) {
                reserva.estado = nuevoEstado;
                estadosGlobales[id] = nuevoEstado;
                const indexFiltrada = reservasFiltradas.findIndex(function(r) { return r.id === id; });
                if (indexFiltrada !== -1) reservasFiltradas[indexFiltrada].estado = nuevoEstado;
                
                localStorage.setItem('estadosReservasCloud', JSON.stringify(estadosGlobales));
                await guardarEstadoEnNube(id, nuevoEstado);
                renderizarCards();
                
                const estadoText = nuevoEstado === 'confirmado' ? 'Confirmada' : (nuevoEstado === 'pendiente' ? 'Pendiente' : 'Pagada');
                alert(`✅ Estado cambiado a: ${estadoText}`);
            }
        }

        function enviarWhatsApp(reserva) {
            let telefono = reserva.telefono.replace(/\D/g, '');
            if (telefono.length === 10) {
                telefono = '54' + telefono;
            }

            let excursionesTexto = '';
            if (reserva.excursionesLista && reserva.excursionesLista.length > 0) {
                excursionesTexto = reserva.excursionesLista.map(function(exc, idx) { return (idx+1) + '. ' + exc; }).join('\n');
            } else {
                excursionesTexto = 'Sin excursiones específicas';
            }

            let estadoTexto = '';
            switch(reserva.estado) {
                case 'pendiente': estadoTexto = 'Pendiente'; break;
                case 'confirmado': estadoTexto = 'Confirmado'; break;
                case 'pagado': estadoTexto = 'Pagado'; break;
                default: estadoTexto = 'Confirmado';
            }

            const mensaje = '🏔️ *AVENTURA TOTAL* 🏔️\n\n✅ *CONFIRMACIÓN DE RESERVA*\n\n🆔 *N° de reserva:* ' + reserva.id + '\n📅 *Fecha:* ' + reserva.fecha + '\n\n👤 *DATOS DEL PASAJERO:*\n   Nombre: ' + reserva.nombre + '\n   📞 Teléfono: ' + reserva.telefono + '\n   📧 Email: ' + reserva.email + '\n\n📍 *DESTINO:*\n   ' + reserva.ciudad + '\n\n✨ *EXCURSIONES SELECCIONADAS:*\n' + excursionesTexto + '\n\n👥 *Cantidad de personas:* ' + reserva.personas + '\n💳 *Forma de pago:* ' + reserva.formaPago + '\n🚐 *Punto de encuentro:* ' + reserva.lugar + '\n📌 *Estado:* ' + estadoTexto + '\n\n📌 *PRÓXIMOS PASOS:*\n• En las próximas 24hs recibirás detalles de pago\n• Punto de encuentro exacto será confirmado\n\n🏔️ ¡Gracias por confiar en Aventura Total!';

            const mensajeCodificado = encodeURIComponent(mensaje);
            window.open('https://wa.me/' + telefono + '?text=' + mensajeCodificado, '_blank');
        }

        // ==================================================
        // FUNCIÓN PARA CALCULAR TOTAL DE PASAJEROS
        // ==================================================
        function calcularTotalPasajeros(reservas) {
            let total = 0;
            for (let i = 0; i < reservas.length; i++) {
                total += reservas[i].personas || 1;
            }
            return total;
        }

        // ==================================================
        // FUNCIÓN PARA VERIFICAR SI UNA RESERVA PERTENECE A UN EVENTO
        // ==================================================
        function reservaPerteneceAEvento(reserva, eventoId) {
            if (eventoId === 'todos') return true;
            
            const evento = eventosCalendario.find(e => e.id === eventoId);
            if (!evento) return true;
            
            const fechaReserva = reserva.fecha;
            if (!fechaReserva) return false;
            
            const fechaInicio = convertirFechaISOtoDDMMYYYY(evento.fechaInicio);
            const fechaFin = convertirFechaISOtoDDMMYYYY(evento.fechaFin);
            
            const fechaReservaNum = fechaDDMMYYYYtoNumero(fechaReserva);
            const fechaInicioNum = fechaDDMMYYYYtoNumero(fechaInicio);
            const fechaFinNum = fechaDDMMYYYYtoNumero(fechaFin);
            
            return fechaReservaNum >= fechaInicioNum && fechaReservaNum <= fechaFinNum;
        }

        // ==================================================
        // FUNCIÓN PARA FILTRAR RESERVAS (MULTIPLE FILTRO)
        // ==================================================
        function filtrarReservas() {
            const busqueda = document.getElementById('busquedaReserva');
            const filtroCiudad = document.getElementById('filtroCiudad');
            const filtroEstado = document.getElementById('filtroEstado');
            const filtroEvento = document.getElementById('filtroEvento');
            
            const texto = busqueda ? busqueda.value.toLowerCase().trim() : '';
            const ciudad = filtroCiudad ? filtroCiudad.value.toLowerCase().trim() : '';
            const estado = filtroEstado ? filtroEstado.value : 'todos';
            const eventoId = filtroEvento ? filtroEvento.value : 'todos';

            reservasFiltradas = reservasData.filter(function(r) {
                // Filtro por nombre o excursión
                let coincideBusqueda = true;
                if (texto) {
                    const coincideNombre = r.nombre.toLowerCase().includes(texto);
                    const coincideExcursion = r.excursionesLista.some(function(exc) {
                        return exc.toLowerCase().includes(texto);
                    });
                    coincideBusqueda = coincideNombre || coincideExcursion;
                }
                
                // Filtro por ciudad
                let coincideCiudad = true;
                if (ciudad) {
                    coincideCiudad = r.ciudad.toLowerCase().includes(ciudad);
                }
                
                // Filtro por estado
                let coincideEstado = true;
                if (estado !== 'todos') {
                    coincideEstado = r.estado === estado;
                }
                
                // Filtro por evento del calendario (por rango de fechas)
                let coincideEvento = true;
                if (eventoId !== 'todos') {
                    coincideEvento = reservaPerteneceAEvento(r, eventoId);
                }
                
                return coincideBusqueda && coincideCiudad && coincideEstado && coincideEvento;
            });
            
            renderizarCards();
        }

        function renderizarCards() {
            const container = document.getElementById('cardsContainer');
            const totalSpan = document.getElementById('totalReservasSpan');
            if (!container) return;

            if (reservasFiltradas.length === 0) {
                container.innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:50px; color: var(--text-muted);">📋 No hay reservas que coincidan con los filtros</div>';
                if (totalSpan) totalSpan.textContent = '0 reservas';
                return;
            }

            function escapeHtml(text) { 
                if (!text) return ''; 
                const div = document.createElement('div'); 
                div.textContent = text; 
                return div.innerHTML; 
            }

            const nombresEditados = cargarNombresEditados();
            reservasFiltradas.forEach(reserva => {
                if (nombresEditados[reserva.id]) {
                    reserva.nombre = nombresEditados[reserva.id];
                }
            });

            for (let idx = 0; idx < reservasFiltradas.length; idx++) {
                const r = reservasFiltradas[idx];
                let estadoText = '';
                let estadoClass = '';
                switch(r.estado) {
                    case 'pendiente': 
                        estadoText = 'Pendiente'; 
                        estadoClass = 'estado-pendiente';
                        break;
                    case 'confirmado': 
                        estadoText = 'Confirmado'; 
                        estadoClass = 'estado-confirmado';
                        break;
                    case 'pagado': 
                        estadoText = 'Pagado'; 
                        estadoClass = 'estado-pagado';
                        break;
                    default: 
                        estadoText = 'Confirmado'; 
                        estadoClass = 'estado-confirmado';
                }

                let excursionesHtml = '<ul class="excursiones-lista-card">';

                    excursionesHtml += '<li>Sin excursiones</li>';
                } else {
                    for (let i = 0; i < r.excursionesLista.length; i++) {
                        excursionesHtml += '<li>' + (i+1) + '. ' + escapeHtml(r.excursionesLista[i]) + '</li>';
                    }
                }
                excursionesHtml += '</ul>';

                html += '<div class="reserva-card">' +
                            '<div class="card-header">' +
                                '<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">' +
                                    '<span class="card-id"><i class="ph ph-hash" style="font-size:10px;"></i> ' + escapeHtml(r.id) + '</span>' +
                                    '<button class="btn-editar-nombre" onclick="editarNombreReserva(\'' + r.id + '\', \'' + escapeHtml(r.nombre).replace(/'/g, "\\'") + '\')" title="Editar nombre"><i class="ph ph-pencil"></i></button>' +
                                    '<span class="card-estado-header ' + estadoClass + '">' + estadoText + '</span>' +
                                '</div>' +
                                '<span class="card-fecha"><i class="ph ph-calendar"></i> ' + escapeHtml(r.fecha) + '</span>' +
                            '</div>' +
                            '<div class="card-body">' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-user"></i> CLIENTE</div><div class="card-value">' + escapeHtml(r.nombre) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-envelope"></i> EMAIL</div><div class="card-value">' + escapeHtml(r.email) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-phone"></i> TELÉFONO</div><div class="card-value">' + escapeHtml(r.telefono) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-map-pin"></i> CIUDAD</div><div class="card-value">' + escapeHtml(r.ciudad) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-tree"></i> EXCURSIONES</div>' + excursionesHtml + '</div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-users"></i> PERSONAS</div><div class="card-value">' + escapeHtml(r.personas) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-credit-card"></i> FORMA DE PAGO</div><div class="card-value">' + escapeHtml(r.formaPago) + '</div></div>' +
                                '<div class="card-info"><div class="card-label"><i class="ph ph-map-trifold"></i> LUGAR</div><div class="card-value">' + escapeHtml(r.lugar) + '</div></div>' +
                            '</div>' +
                            '<div class="card-actions">' +
                                '<button class="btn-card btn-confirmar-card" data-id="' + escapeHtml(r.id) + '" data-estado="confirmado"><i class="ph ph-check-circle"></i> Confirmada</button>' +
                                '<button class="btn-card btn-pendiente-card" data-id="' + escapeHtml(r.id) + '" data-estado="pendiente"><i class="ph ph-clock"></i> Pendiente</button>' +
                                '<button class="btn-card btn-pagar-card" data-id="' + escapeHtml(r.id) + '" data-estado="pagado"><i class="ph ph-currency-dollar"></i> Pagada</button>' +
                                '<button class="btn-card btn-whatsapp-card" data-id="' + escapeHtml(r.id) + '"><i class="ph ph-whatsapp-logo"></i> WhatsApp</button>' +
                                '<button class="btn-card btn-excluir-card" data-id="' + escapeHtml(r.id) + '"><i class="ph ph-trash"></i> Apagar</button>' +
                            '</div>' +
                        '</div>';
            }
            container.innerHTML = html;

            const totalPasajeros = calcularTotalPasajeros(reservasFiltradas);
            const totalReservas = reservasFiltradas.length;
            const totalOriginal = reservasData.length;
            
            if (totalSpan) {
                if (totalReservas === totalOriginal) {
                    totalSpan.textContent = totalReservas + ' reservas - ' + totalPasajeros + ' pasajeros';
                } else {
                    totalSpan.textContent = totalReservas + ' de ' + totalOriginal + ' reservas - ' + totalPasajeros + ' pasajeros';
                }
            }

            document.querySelectorAll('.btn-confirmar-card').forEach(function(btn) {
                btn.addEventListener('click', function() { cambiarEstado(btn.dataset.id, 'confirmado'); });
            });
            document.querySelectorAll('.btn-pendiente-card').forEach(function(btn) {
                btn.addEventListener('click', function() { cambiarEstado(btn.dataset.id, 'pendiente'); });
            });
            document.querySelectorAll('.btn-pagar-card').forEach(function(btn) {
                btn.addEventListener('click', function() { cambiarEstado(btn.dataset.id, 'pagado'); });
            });
            document.querySelectorAll('.btn-whatsapp-card').forEach(function(btn) {
                const reserva = reservasData.find(function(r) { return r.id === btn.dataset.id; });
                btn.addEventListener('click', function() { enviarWhatsApp(reserva); });
            });
            document.querySelectorAll('.btn-excluir-card').forEach(function(btn) {
                btn.addEventListener('click', function() { excluirReserva(btn.dataset.id); });
            });
        }

        function excluirReserva(id) {
            if (confirm('⚠️ ¿Estás seguro de excluir la reserva ' + id + '?')) {
                const excluidos = JSON.parse(localStorage.getItem('reservasExcluidas') || '[]');
                if (!excluidos.includes(id)) {
                    excluidos.push(id);
                    localStorage.setItem('reservasExcluidas', JSON.stringify(excluidos));
                }
                cargarReservas();
                alert('✅ Reserva ' + id + ' excluida.');
            }
        }

        function generarPDFExterno() {
            const busquedaInput = document.getElementById('busquedaReserva');
            let filtroTexto = busquedaInput ? busquedaInput.value.trim() : '';

            if (reservasFiltradas.length === 0) {
                alert('⚠️ No hay reservas para exportar.');
                return;
            }

            try {
                localStorage.setItem('filtroExcursionPDF', filtroTexto);
                localStorage.setItem('reservasFiltradasPDF', JSON.stringify(reservasFiltradas));
                console.log('✅ Datos guardados para PDF:', { filtro: filtroTexto || '(vacio)', total: reservasFiltradas.length });
            } catch(e) {
                console.error('Error al guardar:', e);
                alert('❌ Error al preparar los datos para el PDF.');
                return;
            }

            const pdfWindow = window.open('generar-pdf.html', '_blank');
            if (!pdfWindow) {
                alert('⚠️ Por favor, permita ventanas emergentes para generar el PDF.');
            }
        }

        // ==================================================
        // INICIALIZAR
        // ==================================================
        function init() {
            const btnFiltrar = document.getElementById('btnFiltrar');
            const btnRecargar = document.getElementById('btnRecargar');
            const btnPDFExterno = document.getElementById('btnPDFExterno');
            const busquedaInput = document.getElementById('busquedaReserva');
            const filtroCiudad = document.getElementById('filtroCiudad');
            const filtroEstado = document.getElementById('filtroEstado');
            const filtroEvento = document.getElementById('filtroEvento');
            
            if (btnFiltrar) btnFiltrar.addEventListener('click', filtrarReservas);
            if (btnRecargar) btnRecargar.addEventListener('click', cargarReservas);
            if (btnPDFExterno) btnPDFExterno.addEventListener('click', generarPDFExterno);
            
            [busquedaInput, filtroCiudad, filtroEstado, filtroEvento].forEach(function(input) {
                if (input) {
                    input.addEventListener('keypress', function(e) { 
                        if (e.key === 'Enter') filtrarReservas(); 
                    });
                }
            });
            
            if (filtroEvento) {
                filtroEvento.addEventListener('change', filtrarReservas);
            }
            
            cargarReservas();
            
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    console.log('🔄 Actualización automática - pestaña visible');
                    cargarReservas();
                }
            }, 120000);
        }
        
        window.logout = logout;
        window.filtrarReservas = filtrarReservas;
        window.cargarReservas = cargarReservas;
        window.generarPDFExterno = generarPDFExterno;
        window.abrirReservaManual = abrirReservaManual;
        window.editarNombreReserva = editarNombreReserva;
        window.toggleTheme = toggleTheme;
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
